name: main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Линтер появился здесь потому, что до этого workflow только собирал и пушил
  # образ: «зависимости обновлены» ничем не подтверждалось.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-python не нужен: версию питона держит .python-version, и uv сам
      # ставит её при первом `uv sync`. Единый источник версии, поэтому раннер
      # и образ кита не могут разойтись.
      - uses: astral-sh/setup-uv@v10.0.0

      - name: Install
        run: make install
      - name: Run linter
        run: make lint

      # Тесты в CI не гоняются: test_server.py это интеграционный тест, он
      # стучится на localhost:4000 к поднятому приложению, а данные берёт из
      # внешней базы db.hexlet.app. Локально это `make compose` плюс `make test`.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: ghcr.io/${{ github.repository }}:latest
          cache-to: type=inline
          tags: ghcr.io/${{ github.repository }}:latest
